[options]
HoldPkg = pacman glibc
Architecture = auto x86_64_v3
Color
CheckSpace
VerbosePkgLists
ILoveCandy
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

# Arch Linux testing repositories

# [gnome-unstable]
# Include = /root/perfect/pacman.d/mirrorlist
# Usage = Sync Install Upgrade

[core-testing]
Include = /root/perfect/pacman.d/mirrorlist
Usage = Sync Install Upgrade

[extra-testing]
Include = /root/perfect/pacman.d/mirrorlist
