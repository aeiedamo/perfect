# Operation
TLP_ENABLE=1
TLP_DISABLE_DEFAULTS=0
TLP_WARN_LEVEL=3
TLP_MSG_COLORS="91 93 1 92"
TLP_AUTO_SWITCH=2
TLP_PROFILE_PRF=PRF
TLP_PROFILE_BAL=BAL
TLP_PROFILE_DEFAULT=BAL

# Audio
SOUND_POWER_SAVE_ON_PRF=0
SOUND_POWER_SAVE_ON_BAL=0
SOUND_POWER_SAVE_CONTROLLER=0

# Battery Care
START_CHARGE_THRESH_BAL0=0
STOP_CHARGE_THRESH_BAL0=95
START_CHARGE_THRESH_BAL1=0
STOP_CHARGE_THRESH_BAL1=95
RESTORE_THRESHOLDS_ON_BAL=1

# Disks and Controllers
DISK_DEVICES="nvme0n1 nvme1n1"
DISK_APM_LEVEL_ON_PRF="254 254"
DISK_APM_LEVEL_ON_BAL="128 128"
DISK_APM_LEVEL_ON_SAV="128 128"
DISK_IOSCHED="mq-deadline mq-deadline"
AHCI_RUNTIME_PM_ON_PRF=on
AHCI_RUNTIME_PM_ON_BAL=auto
AHCI_RUNTIME_PM_ON_SAV=auto
AHCI_RUNTIME_PM_TIMEOUT=60

# Filesystem
DISK_IDLE_SECS_ON_PRF=0
DISK_IDLE_SECS_ON_BAL=2
MAX_LOST_WORK_SECS_ON_PRF=15
MAX_LOST_WORK_SECS_ON_BAL=30
MAX_LOST_WORK_SECS_ON_SAV=30

# Kernel
NMI_WATCHDOG=0

# Networks
WIFI_PWR_ON_PRF=off
WIFI_PWR_ON_BAL=off
WIFI_PWR_ON_SAV=off
WOL_DISABLE=N

# Platform
PLATFORM_PROFILE_ON_PRF=performance
PLATFORM_PROFILE_ON_BAL=balanced
PLATFORM_PROFILE_ON_SAV=balanced
MEM_SLEEP_ON_PRF=deep
MEM_SLEEP_ON_BAL=deep
MEM_SLEEP_ON_SAV=deep

# Processor
CPU_DRIVER_OPMODE_ON_PRF=active
CPU_DRIVER_OPMODE_ON_BAL=active
CPU_DRIVER_OPMODE_ON_SAV=active
CPU_SCALING_GOVERNOR_ON_PRF=performance
CPU_SCALING_GOVERNOR_ON_BAL=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_ENERGY_PERF_POLICY_ON_PRF=performance
CPU_ENERGY_PERF_POLICY_ON_BAL=balance_power
CPU_ENERGY_PERF_POLICY_ON_SAV=power
CPU_MIN_PERF_ON_PRF=0
CPU_MAX_PERF_ON_PRF=100
CPU_MIN_PERF_ON_BAL=0
CPU_MAX_PERF_ON_BAL=75
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=50
CPU_BOOST_ON_PRF=1
CPU_BOOST_ON_BAL=1
CPU_BOOST_ON_SAV=0
CPU_HWP_DYN_BOOST_ON_PRF=1
CPU_HWP_DYN_BOOST_ON_BAL=1
CPU_HWP_DYN_BOOST_ON_SAV=0

# Radio Device Wizard
DEVICES_TO_DISABLE_ON_LAN_CONNECT="wifi"
DEVICES_TO_ENABLE_ON_LAN_DISCONNECT="wifi"

# Runtime Power Management and ASPM
RUNTIME_PM_ON_PRF=on
RUNTIME_PM_ON_BAL=auto
RUNTIME_PM_ON_SAV=auto
PCIE_ASPM_ON_PRF=performance
PCIE_ASPM_ON_BAL=default
PCIE_ASPM_ON_SAV=powersave

# USB
USB_AUTOSUSPEND=0
